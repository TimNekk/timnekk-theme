name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Get version from package.json
              id: pkg
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Check if tag already exists
              id: tag_check
              run: |
                  if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                  fi

            - name: Package extension
              if: steps.tag_check.outputs.exists == 'false'
              id: package
              run: |
                  npx vsce package
                  echo "vsix=$(ls *.vsix | head -1)" >> $GITHUB_OUTPUT

            - name: Publish to VS Code Marketplace
              if: steps.tag_check.outputs.exists == 'false'
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  set +e
                  OUTPUT=$(npx vsce publish --no-dependencies --packagePath "${{ steps.package.outputs.vsix }}" 2>&1)
                  EXIT_CODE=$?
                  echo "$OUTPUT"
                  if [ $EXIT_CODE -ne 0 ] && ! echo "$OUTPUT" | grep -q "already exists"; then
                  exit $EXIT_CODE
                  fi

            - name: Publish to Open VSX Registry
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  set +e
                  OUTPUT=$(npx ovsx publish "${{ steps.package.outputs.vsix }}" --pat ${{ secrets.OVSX_PAT }} 2>&1)
                  EXIT_CODE=$?
                  echo "$OUTPUT"
                  if [ $EXIT_CODE -ne 0 ] && ! echo "$OUTPUT" | grep -q "already exists"; then
                  exit $EXIT_CODE
                  fi

            - name: Create GitHub Release
              if: steps.tag_check.outputs.exists == 'false'
              uses: softprops/action-gh-release@v2.6.1
              with:
                  tag_name: v${{ steps.pkg.outputs.version }}
                  files: "*.vsix"
                  generate_release_notes: true
